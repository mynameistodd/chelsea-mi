<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004B87"/>
      <stop offset="100%" stop-color="#0066B3"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- Stylized Quirky Clocktower Silhouette -->
  <!-- Tower Body -->
  <rect x="24" y="26" width="16" height="28" rx="2" fill="#FFFFFF"/>
  <rect x="26" y="28" width="12" height="24" rx="1" fill="#FFF2F4"/>
  
  <!-- Tower Roof / Dome -->
  <path d="M21 26 L32 10 L43 26 Z" fill="url(#roofGrad)"/>
  <!-- Weather Vane Pin -->
  <line x1="32" y1="10" x2="32" y2="6" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="2" fill="#FFD166"/>
  
  <!-- Quirky Clock Face -->
  <circle cx="32" cy="35" r="5" fill="#004B87"/>
  <circle cx="32" cy="35" r="4" fill="#FFFFFF"/>
  <!-- Clock Hands pointing to 4:55 / 5:00 -->
  <line x1="32" y1="35" x2="32" y2="32" stroke="#FF6584" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="35" x2="34.5" y2="36" stroke="#004B87" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Cute Wink/Sparkle Eyes at the top -->
  <circle cx="16" cy="18" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="48" cy="18" r="2.5" fill="#FFEAA7"/>
</svg>
